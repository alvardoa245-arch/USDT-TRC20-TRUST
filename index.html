<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR pagos - Pago Seguro</title>
    <style>
        /* Mantienes tus estilos limpios originales */
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f7f9ff; color: #111111; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-top: 30px; }
        .tw-container { width: 100%; max-width: 390px; padding: 20px; flex: 1; }
        .tw-header { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 24px; }
        .tw-header-title-main { font-size: 21px; font-weight: 700; color: #111111; }
        .tw-network-badge { display: inline-flex; padding: 4px 8px; border-radius: 999px; background: #eef3ff; border: 1px solid #dbe6ff; color: #0052ff; font-size: 10px; font-weight: 700; }
        .tw-input-group { background: rgba(255, 255, 255, 0.88); border: 1px solid rgba(205, 215, 232, 0.78); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
        .tw-label { font-size: 13px; color: #717680; display: block; margin-bottom: 8px; }
        .tw-input { background: transparent; border: none; color: #111111; font-size: 16px; width: 100%; outline: none; }
        .tw-btn { width: 100%; height: 52px; background-color: #0052ff; color: #ffffff; border: none; border-radius: 26px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 20px; }
        .status-box { background-color: #edf2ff; border: 1px solid #cce0ff; border-radius: 12px; padding: 12px; font-size: 13px; color: #0052ff; margin-bottom: 16px; display: none; }
    </style>
</head>
<body>

<div class="tw-container">
    <div class="tw-header">
        <div class="tw-header-title">
            <span class="tw-header-title-main">Pago Seguro USDT</span>
            <span class="tw-network-badge">TRC-20</span>
        </div>
    </div>

    <div class="tw-input-group">
        <label class="tw-label" for="amountInput">Cantidad a pagar (USDT)</label>
        <input id="amountInput" class="tw-input" type="number" placeholder="0.00" min="1" step="any">
    </div>

    <div id="status" class="status-box"></div>

    <button class="tw-btn" id="payBtn">Generar Pago Profesional</button>
</div>

<script>
    const payBtn = document.getElementById('payBtn');
    const amountInput = document.getElementById('amountInput');
    const statusDiv = document.getElementById('status');

    function setStatus(msg) {
        statusDiv.innerText = msg;
        statusDiv.style.display = msg ? 'block' : 'none';
    }

    payBtn.addEventListener('click', async () => {
        const amount = parseFloat(amountInput.value);
        if (isNaN(amount) || amount <= 0) {
            setStatus("Por favor, introduce un monto válido.");
            return;
        }

        try {
            payBtn.disabled = true;
            setStatus("Generando orden de pago en la pasarela...");

            // AQUÍ LLAMAS A TU BACKEND O DIRECTAMENTE A LA API DE LA PASARELA (Ej: NOWPayments)
            // Nota: Por seguridad de tus llaves API, esta petición debe pasar por tu backend ("midax") 
            // para que cree la orden de forma segura y devuelva la URL de pago al frontend.
            
            const response = await fetch('https://tu-backend-midax.com/api/crear-pago', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    price_amount: amount,
                    price_currency: 'usd',
                    pay_currency: 'usdttrc20'
                })
            });

            const data = await response.json();

            if (data && data.invoice_url) {
                setStatus("¡Orden generada! Redirigiendo a la pasarela...");
                // Redirige al usuario a la interfaz limpia de la pasarela de pago
                window.location.href = data.invoice_url;
            } else {
                throw new Error("No se pudo obtener la URL de pago de la pasarela.");
            }

        } catch (error) {
            console.error(error);
            setStatus(error.message || "Error al procesar la solicitud.");
            payBtn.disabled = false;
        }
    });
</script>

</body>
</html>
